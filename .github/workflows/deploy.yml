name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Publish to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sistema-centro-fashion-web
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restart Deployment on VPS
        if: ${{ env.VPS_SSH_KEY != '' }}
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.199.187.141
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            k3s kubectl rollout restart deployment/sistema-centro-fashion-web -n business
